[package]
name = "algotype"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
description = "A quiet place to build fast hands. Adaptive, local-first typing practice."
license = "MIT"

[dependencies]
anyhow = "1"
crossterm = "0.28"
directories = "6"
fs2 = "0.4"
rand = "0.8"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
